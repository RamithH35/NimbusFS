name: Keep Services Alive

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Secondary (healthy instance)
        run: |
          curl -sf --max-time 15 \
            "${{ secrets.SUPABASE_URL_2 }}/storage/v1/object/list/${{ secrets.SUPABASE_BUCKET_2 }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}" \
            -H "Content-Type: application/json" \
            --data '{"prefix":"","limit":1}'
          echo "Supabase Secondary ping OK"

      - name: Ping Upstash Redis
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.UPSTASH_REDIS_REST_URL }}/set/keepalive/$(date +%s)" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}")
          echo "Redis response: $RESPONSE"

      - name: Ping MongoDB Atlas
        run: |
          curl -sf --max-time 15 \
            "${{ secrets.MONGODB_URI }}" \
            --output /dev/null
          echo "MongoDB Atlas ping OK"

      - name: Ping Supabase Primary (best-effort while support ticket open)
        continue-on-error: true
        run: |
          curl -sf --max-time 10 \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/list/${{ secrets.SUPABASE_BUCKET }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{"prefix":"","limit":1}' || echo "Supabase Primary unreachable (support ticket open — non-blocking)"

      - name: Summary
        run: echo "All services pinged at $(date)"