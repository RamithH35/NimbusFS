name: Keep Services Alive

on:
  schedule:
    - cron: '0 8 * * *'  # Every day at 8am UTC — daily is safer than every 3 days
  workflow_dispatch:      # Manual trigger button in GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Primary (list bucket)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/list/${{ secrets.SUPABASE_BUCKET }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"prefix": "", "limit": 1}')
          echo "Supabase Primary response: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "WARNING: Supabase Primary returned $RESPONSE"
          fi

      - name: Ping Supabase Secondary (list bucket)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL_2 }}/storage/v1/object/list/${{ secrets.SUPABASE_BUCKET_2 }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}" \
            -H "Content-Type: application/json" \
            -d '{"prefix": "", "limit": 1}')
          echo "Supabase Secondary response: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "WARNING: Supabase Secondary returned $RESPONSE"
          fi

      - name: Ping Upstash Redis
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.UPSTASH_REDIS_REST_URL }}/set/keepalive/$(date +%s)" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}")
          echo "Redis response: $RESPONSE"

      - name: Ping MongoDB Atlas
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://cloud.mongodb.com/api/atlas/v1.0" \
            -u "${{ secrets.MONGODB_PUBLIC_KEY }}:${{ secrets.MONGODB_PRIVATE_KEY }}" \
            --digest)
          echo "MongoDB Atlas API response: $RESPONSE"

      - name: Summary
        run: |
          echo "Daily keepalive ping completed at $(date)"
          echo "All services pinged successfully"