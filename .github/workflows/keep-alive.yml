name: Keep Services Alive
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Secondary
        run: |
          curl -s -X POST "${{ secrets.SUPABASE_URL_2 }}/storage/v1/object/list/${{ secrets.SUPABASE_BUCKET_2 }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}" \
            -H "Content-Type: application/json" \
            -d '{"prefix": "", "limit": 1}'
          echo "Supabase Secondary pinged"

      - name: Ping Supabase Primary (best-effort)
        continue-on-error: true
        run: |
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/list/${{ secrets.SUPABASE_BUCKET }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"prefix": "", "limit": 1}'
          echo "Supabase Primary pinged (best-effort)"

      - name: Install redis-cli
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Ping Upstash Redis
        run: |
          redis-cli -u "${{ secrets.UPSTASH_REDIS_URL }}" SET keepalive "$(date +%s)"
          echo "Redis pinged"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pymongo
        run: pip install pymongo

      - name: Ping MongoDB Atlas
        run: |
          python3 -c "
          import pymongo, os
          client = pymongo.MongoClient(os.environ['MONGODB_URI'])
          client.admin.command('ping')
          print('MongoDB Atlas pinged')
          "
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Summary
        run: echo "All services pinged at $(date)"