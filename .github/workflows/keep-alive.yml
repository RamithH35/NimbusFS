name: Keep Services Alive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Storage
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/storage/v1/object/list/${{ secrets.SUPABASE_BUCKET }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"prefix": "uploads", "limit": 1}'

      - name: Install redis-cli
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Ping Upstash Redis (real write)
        run: |
          redis-cli -u "${{ secrets.UPSTASH_REDIS_URL }}" SET keepalive "$(date +%s)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pymongo
        run: pip install pymongo

      - name: Ping MongoDB Atlas
        run: |
          python3 -c "
          import pymongo, os
          client = pymongo.MongoClient(os.environ['MONGODB_URI'])
          client.admin.command('ping')
          "
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
