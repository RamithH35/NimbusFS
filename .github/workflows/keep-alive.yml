name: Keep Services Alive

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Secondary (healthy instance)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL_2 }}/storage/v1/object/list/${{ secrets.SUPABASE_BUCKET_2 }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}" \
            -H "Content-Type: application/json" \
            -d '{"prefix": "", "limit": 1}')
          echo "Supabase Secondary response: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "WARNING: Supabase Secondary returned $RESPONSE"
            exit 1
          fi

      - name: Ping Upstash Redis
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.UPSTASH_REDIS_REST_URL }}/set/keepalive/$(date +%s)" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}")
          echo "Redis response: $RESPONSE"

      - name: Ping MongoDB Atlas
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.MONGODB_URI }}" || echo "skipped")
          echo "MongoDB ping attempted"

      - name: Ping Supabase Primary (best-effort, may fail while support ticket open)
        continue-on-error: true
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/list/${{ secrets.SUPABASE_BUCKET }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"prefix": "", "limit": 1}')
          echo "Supabase Primary response: $RESPONSE (best-effort — support ticket open)"

      - name: Summary
        run: echo "Keepalive completed at $(date)"